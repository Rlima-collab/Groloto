
services:
  # Service principal de l'application Symfony
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: groloto_app
    ports:
      - "8080:80"
    volumes:
      # Monter le répertoire var pour persister les données
      - ./var:/var/www/html/var
      # Monter les assets pour le développement (optionnel)
      - ./public:/var/www/html/public
    environment:
      APP_ENV: ${APP_ENV:-prod}
      APP_SECRET: ${APP_SECRET:-SomeRandomSecret123}
      DATABASE_URL: "sqlite:///%kernel.project_dir%/var/data.db"
    depends_on:
      - mailer
    networks:
      - groloto_network
    restart: unless-stopped

  # Service Mailer pour les emails (développement)
  mailer:
    image: axllent/mailpit
    container_name: groloto_mailer
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - groloto_network
    restart: unless-stopped

networks:
  groloto_network:
    driver: bridge
