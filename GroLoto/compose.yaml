
services:
  # Service principal de l'application Symfony
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: groloto_app
    ports:
      - "8080:80"
    volumes:
      # Monter le répertoire var pour persister les données
      - ./var:/var/www/html/var
      # Monter les assets pour le développement (optionnel)
      - ./public:/var/www/html/public
    environment:
      # For Docker use Postgres by default so the app works the same for everyone
      APP_ENV: ${APP_ENV:-prod}
      APP_DEBUG: ${APP_DEBUG:-0}
      APP_SECRET: ${APP_SECRET:-SomeRandomSecret123}
      DATABASE_URL: ${DATABASE_URL:-"pgsql://postgres:postgres@db:5432/groloto?serverVersion=15&charset=utf8"}
    depends_on:
      - db
      - mailer
    networks:
      - groloto_network
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/docker-entrypoint.sh"]

  # Service Postgres pour persistance et stabilité (shared by all devs)
  db:
    image: postgres:15
    container_name: groloto_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: groloto
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres -d groloto"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - groloto_network
    restart: unless-stopped

  # Service Mailer pour les emails (développement)
  mailer:
    image: axllent/mailpit
    container_name: groloto_mailer
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - groloto_network
    restart: unless-stopped

volumes:
  pgdata:

networks:
  groloto_network:
    driver: bridge
