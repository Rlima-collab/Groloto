version: '3.8'

services:
  # Service PostgreSQL
  database:
    image: postgres:16-alpine
    container_name: groloto_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - groloto_network

  # Service PHP-FPM
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: groloto_php
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-!ChangeMe!}@database:5432/${POSTGRES_DB:-app}?serverVersion=16&charset=utf8"
      APP_ENV: dev
      APP_DEBUG: 1
    volumes:
      - .:/var/www/html:cached
    working_dir: /var/www/html
    networks:
      - groloto_network

  # Service Nginx
  nginx:
    image: nginx:1.25-alpine
    container_name: groloto_nginx
    depends_on:
      - php
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - groloto_network

volumes:
  db_data:
    driver: local

networks:
  groloto_network:
    driver: bridge
